<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Coordinate Midpoint Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#121212;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
}

h1{
    text-align:center;
    font-size:2rem;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#cfcfcf;
    font-size:1rem;
    line-height:1.5;
    margin-bottom:25px;
}

.card{
    background:#1f1f1f;
    border-radius:22px;
    padding:25px;
    box-shadow:0 0 20px rgba(0,0,0,.35);
}

.corner{
    margin-bottom:30px;
}

.corner:last-child{
    margin-bottom:0;
}

.corner label{
    display:block;
    font-size:1.15rem;
    font-weight:bold;
    margin-bottom:18px;
}

.coordinate{
    margin-bottom:16px;
}

.coordinate:last-child{
    margin-bottom:0;
}

.coordinate span{
    display:block;
    color:#cfcfcf;
    margin-bottom:8px;
    font-size:.95rem;
}

.input-row{
    display:flex;
    align-items:center;
    gap:10px;
}

input{
    flex:1;
    height:52px;
    background:#2d2d2d;
    border:none;
    border-radius:12px;
    padding:0 14px;
    color:white;
    font-size:1.1rem;
    outline:none;
}

input:focus{
    border:2px solid #2d8cff;
}

.neg-btn{
    width:52px;
    height:52px;
    border:none;
    border-radius:12px;
    background:#3b3b3b;
    color:white;
    font-size:1.4rem;
    font-weight:bold;
    cursor:pointer;
}

.neg-btn:active{
    transform:scale(.96);
}

.calculate{
    width:100%;
    height:58px;
    margin-top:25px;
    background:#2d8cff;
    border:none;
    border-radius:16px;
    color:white;
    font-size:1.2rem;
    font-weight:bold;
    cursor:pointer;
}

.calculate:active{
    transform:scale(.98);
}

</style>
</head>

<body>

<div class="container">

<h1>Coordinate Midpoint Calculator</h1>

<div class="subtitle">
Insert the X and Y coordinates for each corner of the rectangular part.
</div>

<div class="card">

<!-- Top Left -->
<div class="corner">

<label>Top Left</label>

<div class="coordinate">
<span>X</span>
<div class="input-row">
<input type="decimal" id="tlx" step="any" placeholder="0.000">
<button class="neg-btn" onclick="toggleNegative('tlx')" type="button">±</button>
</div>
</div>

<div class="coordinate">
<span>Y</span>
<div class="input-row">
<input type="decimal" id="tly" step="any" placeholder="0.000">
<button class="neg-btn" onclick="toggleNegative('tly')" type="button">±</button>
</div>
</div>

</div>

<!-- Top Right -->
<div class="corner">

<label>Top Right</label>

<div class="coordinate">
<span>X</span>
<div class="input-row">
<input type="decimal" id="trx" step="any" placeholder="0.000">
<button class="neg-btn" onclick="toggleNegative('trx')" type="button">±</button>
</div>
</div>

<div class="coordinate">
<span>Y</span>
<div class="input-row">
<input type="decimal" id="try" step="any" placeholder="0.000">
<button class="neg-btn" onclick="toggleNegative('try')" type="button">±</button>
</div>
</div>

</div>

<!-- Bottom Right -->
<div class="corner">

<label>Bottom Right</label>

<div class="coordinate">
<span>X</span>
<div class="input-row">
<input type="decimal" id="brx" step="any" placeholder="0.000">
<button class="neg-btn" onclick="toggleNegative('brx')" type="button">±</button>
</div>
</div>

<div class="coordinate">
<span>Y</span>
<div class="input-row">
<input type="decimal" id="bry" step="any" placeholder="0.000">
<button class="neg-btn" onclick="toggleNegative('bry')" type="button">±</button>
</div>
</div>

</div>

<!-- Bottom Left -->
<div class="corner">

<label>Bottom Left</label>

<div class="coordinate">
<span>X</span>
<div class="input-row">
<input type="decimal" id="blx" step="any" placeholder="0.000">
<button class="neg-btn" onclick="toggleNegative('blx')" type="button">±</button>
</div>
</div>

<div class="coordinate">
<span>Y</span>
<div class="input-row">
<input type="decimal" id="bly" step="any" placeholder="0.000">
<button class="neg-btn" onclick="toggleNegative('bly')" type="button">±</button>
</div>
</div>

</div>

</div>

<button class="calculate" id="calculateBtn">
Calculate
</button>

</div>

<script>

function toggleNegative(id){

    const input = document.getElementById(id);

    if(input.value === "") return;

    let value = parseFloat(input.value);

    if(isNaN(value)) return;

    input.value = (-value).toString();
}

document.getElementById("calculateBtn").addEventListener("click",function(){

    alert("Results page coming next!");

});

</script>

</body>
</html>
